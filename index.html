<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDGs不塑永續 - 淨灘</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            overflow: hidden;
            user-select: none;
            touch-action: manipulation;
        }
        @keyframes wave {
            0% { transform: translateX(0) translateZ(0) scaleY(1); }
            50% { transform: translateX(-25%) translateZ(0) scaleY(0.85); }
            100% { transform: translateX(-50%) translateZ(0) scaleY(1); }
        }
        .wave-animation {
            animation: wave 7s cubic-bezier(0.36, 0.45, 0.63, 0.53) infinite;
        }
        .wave-animation2 {
            animation: wave 5s cubic-bezier(0.36, 0.45, 0.63, 0.53) infinite reverse;
            opacity: 0.6;
        }
        @keyframes pickUp {
            0% { transform: scale(1) rotate(var(--rot)) translateY(0); opacity: 1; }
            50% { transform: scale(1.35) rotate(calc(var(--rot) + 25deg)) translateY(-45px); }
            100% { transform: scale(0) rotate(calc(var(--rot) + 50deg)) translateY(-100px); opacity: 0; }
        }
        .picked {
            animation: pickUp 0.45s forwards ease-out;
            pointer-events: none;
        }
        /* 雲朵由左向右移動動畫 */
        @keyframes moveClouds {
            0% { transform: translateX(-150px); }
            100% { transform: translateX(calc(100vw + 150px)); }
        }
        .cloud-1 {
            animation: moveClouds 35s linear infinite;
        }
        .cloud-2 {
            animation: moveClouds 45s linear infinite;
            animation-delay: -15s;
        }
        /* 飛碟動畫：由右飛入 -> 中央停留 5 秒 -> 飛往右側 */
        @keyframes ufoFlight {
            0% {
                transform: translateX(120vw) translateY(0) scale(0.6);
                opacity: 0;
            }
            15% {
                transform: translateX(calc(50vw - 60px)) translateY(-10px) scale(1);
                opacity: 1;
            }
            35% {
                transform: translateX(calc(50vw - 60px)) translateY(10px) scale(1);
                opacity: 1;
            }
            55% {
                transform: translateX(calc(50vw - 60px)) translateY(-5px) scale(1);
                opacity: 1;
            }
            /* 停留 5 秒對應的動畫比例區間 (約 45% 至 70% 期間靜止在中央) */
            70% {
                transform: translateX(calc(50vw - 60px)) translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateX(-120vw) translateY(-40px) scale(0.6);
                opacity: 0;
            }
        }
        .ufo-anim {
            animation: ufoFlight 14s ease-in-out forwards;
        }
        @keyframes ufoHover {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .ufo-hover-effect {
            animation: ufoHover 2s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-sky-100 h-screen w-screen flex flex-col justify-between relative overflow-hidden">

    <header class="absolute top-0 left-0 w-full z-30 p-4 md:p-6 flex justify-between items-start pointer-events-none">
        <!-- 左上角標題 -->
        <div class="pointer-events-auto bg-white/90 backdrop-blur-md px-5 py-3 rounded-2xl shadow-xl border border-emerald-100 flex items-center space-x-3 transition-transform hover:scale-105 duration-300">
            <div class="w-10 h-10 bg-emerald-600 rounded-xl flex items-center justify-center text-white shadow-md">
                <i class="fa-solid fa-water text-lg"></i>
            </div>
            <div>
                <h1 class="text-xl md:text-2xl font-black text-emerald-800 tracking-wide">SDGs不塑永續 - 淨灘</h1>
                <p class="text-xs text-emerald-600 font-bold">還給海洋一片乾淨的藍天與沙灘</p>
            </div>
        </div>

        <!-- 右上角成績與計分 -->
        <div class="pointer-events-auto bg-white/90 backdrop-blur-md px-5 py-3 rounded-2xl shadow-xl border border-sky-100 flex items-center space-x-6">
            <div class="text-center">
                <div class="text-xs text-slate-500 font-bold uppercase tracking-wider">目前分數</div>
                <div id="score" class="text-2xl md:text-3xl font-black text-amber-600">0</div>
            </div>
            <div class="h-8 w-px bg-slate-200"></div>
            <div class="text-center">
                <div class="text-xs text-slate-500 font-bold uppercase tracking-wider">剩餘垃圾</div>
                <div id="remaining" class="text-2xl md:text-3xl font-black text-sky-700">50 / 50</div>
            </div>
            <div class="h-8 w-px bg-slate-200"></div>
            <div class="text-center">
                <div class="text-xs text-slate-500 font-bold uppercase tracking-wider">花費時間</div>
                <div id="timer" class="text-xl font-bold text-slate-700">00:00</div>
            </div>
        </div>
    </header>

    <div class="absolute inset-0 z-0 flex flex-col pointer-events-none">
        <!-- 天空層 (含會移動的雲朵與飛碟 UFO) -->
        <div class="h-[40%] w-full bg-gradient-to-b from-sky-400 via-sky-200 to-amber-50 relative overflow-hidden">
            <!-- 太陽 -->
            <div class="absolute top-8 right-20 w-20 h-20 bg-amber-300 rounded-full blur-[1px] shadow-[0_0_40px_rgba(252,211,77,0.8)]"></div>
            
            <!-- 移動雲朵 1 -->
            <div class="absolute top-8 left-0 cloud-1 flex items-center space-x-2 opacity-80">
                <div class="w-32 h-10 bg-white rounded-full shadow-sm"></div>
                <div class="w-16 h-16 bg-white rounded-full -ml-8 -mt-4 shadow-sm"></div>
            </div>
            <!-- 移動雲朵 2 -->
            <div class="absolute top-20 left-0 cloud-2 flex items-center space-x-2 opacity-70">
                <div class="w-40 h-12 bg-white rounded-full shadow-sm"></div>
                <div class="w-20 h-20 bg-white rounded-full -ml-10 -mt-6 shadow-sm"></div>
            </div>

            <!-- 飛碟 (UFO) 元素：由右邊飛入、中央停留 5 秒後向右方飛走 -->
            <div id="ufo-container" class="absolute top-12 z-10 ufo-anim pointer-events-auto cursor-pointer" onclick="clickUfo()">
                <div class="ufo-hover-effect flex flex-col items-center drop-shadow-2xl">
                    <!-- 光束與飛碟主體 -->
                    <div class="relative flex flex-col items-center">
                        <div class="absolute -bottom-6 w-16 h-16 bg-emerald-400/30 rounded-full blur-md"></div>
                        <div class="text-4xl filter drop-shadow-[0_5px_5px_rgba(0,0,0,0.3)]">🛸</div>
                        <div class="bg-black/70 text-emerald-300 text-[10px] font-bold px-2 py-0.5 rounded-full mt-1 border border-emerald-400/50 whitespace-nowrap">
                            環保偵測機 (+50分)
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 海洋與海浪層 -->
        <div class="h-[15%] w-full bg-gradient-to-b from-sky-300 to-teal-400 relative overflow-hidden">
            <div class="absolute bottom-0 left-0 w-[200%] h-8 bg-teal-200/50 wave-animation rounded-full"></div>
            <div class="absolute bottom-1 left-0 w-[200%] h-6 bg-white/40 wave-animation2 rounded-full"></div>
        </div>

        <!-- 沙灘區：網頁下半部，垃圾散佈區域 -->
        <div id="beach-area" class="h-[45%] w-full bg-gradient-to-b from-amber-100 via-amber-200 to-amber-300 relative overflow-hidden pointer-events-auto shadow-inner">
            <div class="absolute inset-0 opacity-20 bg-[radial-gradient(#b45309_1px,transparent_1px)] [background-size:16px_16px]"></div>
        </div>
    </div>

    <div class="absolute bottom-4 left-1/2 transform -translate-x-1/2 z-20 bg-black/60 backdrop-blur-md text-white px-6 py-2.5 rounded-full text-sm font-medium shadow-xl pointer-events-none flex items-center space-x-2">
        <i class="fa-solid fa-hand-pointer text-amber-300 animate-bounce"></i>
        <span>點擊沙灘上的垃圾清理，點擊天空中飛過的 UFO 可獲得額外加分！</span>
    </div>

    <div id="modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full mx-4 shadow-2xl text-center transform transition-all scale-95 opacity-0 duration-300" id="modal-content">
            <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-4xl mx-auto mb-4 shadow-inner animate-pulse">
                <i class="fa-solid fa-award"></i>
            </div>
            <h2 class="text-3xl font-black text-slate-800 mb-2">任務成功！</h2>
            <p class="text-emerald-700 font-bold mb-6">太棒了！您已成功清理所有沙灘垃圾，恢復海洋永續生態！</p>
            
            <div class="bg-slate-50 rounded-2xl p-4 mb-6 border border-slate-100 grid grid-cols-2 gap-4">
                <div class="bg-white p-3 rounded-xl shadow-sm">
                    <div class="text-xs text-slate-400 font-bold">總得分</div>
                    <div id="final-score" class="text-2xl font-black text-amber-600">0</div>
                </div>
                <div class="bg-white p-3 rounded-xl shadow-sm">
                    <div class="text-xs text-slate-400 font-bold">總耗時</div>
                    <div id="final-time" class="text-2xl font-black text-sky-700">00:00</div>
                </div>
            </div>

            <div class="flex flex-col space-y-3">
                <button onclick="restartGame()" class="w-full py-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold rounded-2xl shadow-lg shadow-emerald-600/30 transition-all flex items-center justify-center space-x-2 text-lg">
                    <i class="fa-solid fa-arrow-right"></i>
                    <span>前往下一關 / 再玩一次</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // 垃圾種類、體積與對應積分設定 (總計 50 個)
        const trashTypes = [
            { name: '寶特瓶', emoji: '🍼', points: 10, sizeClass: 'w-10 h-10 text-2xl' },
            { name: '飲料杯', emoji: '🧋', points: 15, sizeClass: 'w-11 h-11 text-2xl' },
            { name: '塑膠袋', emoji: '🛍️', points: 12, sizeClass: 'w-10 h-10 text-2xl' },
            { name: '紙餐盒', emoji: '🥡', points: 20, sizeClass: 'w-12 h-12 text-3xl' },
            { name: '保麗龍', emoji: '📦', points: 30, sizeClass: 'w-14 h-14 text-4xl' },
            { name: '漂流木與漁網', emoji: '🪵', points: 50, sizeClass: 'w-16 h-16 text-4xl' }
        ];

        let score = 0;
        let remainingCount = 50;
        const totalTrash = 50;
        let timerInterval = null;
        let secondsElapsed = 0;
        let gameStarted = false;
        let ufoClicked = false;

        // Web Audio API 合成音效
        function playSound(type) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'collect') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.12);
                } else if (type === 'ufo') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(587, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1174, audioCtx.currentTime + 0.25);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.25);
                } else if (type === 'win') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(350, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(523, audioCtx.currentTime + 0.15);
                    osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.3);
                    osc.frequency.setValueAtTime(784, audioCtx.currentTime + 0.45);
                    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.6);
                }
            } catch (e) {
                // 忽略瀏覽器自動播放限制
            }
        }

        // 點擊 UFO 獲得加分
        function clickUfo() {
            if (ufoClicked) return;
            ufoClicked = true;
            score += 50;
            document.getElementById('score').innerText = score;
            playSound('ufo');

            const ufoEl = document.getElementById('ufo-container');
            ufoEl.style.transform = 'scale(1.5)';
            ufoEl.style.opacity = '0';
            setTimeout(() => {
                ufoEl.style.display = 'none';
            }, 300);
        }

        // 初始化遊戲與隨機分佈垃圾
        function initGame() {
            const beachArea = document.getElementById('beach-area');
            beachArea.innerHTML = '<div class="absolute inset-0 opacity-20 bg-[radial-gradient(#b45309_1px,transparent_1px)] [background-size:16px_16px]"></div>';
            
            score = 0;
            remainingCount = totalTrash;
            secondsElapsed = 0;
            gameStarted = false;
            ufoClicked = false;

            document.getElementById('score').innerText = score;
            document.getElementById('remaining').innerText = `${remainingCount} / ${totalTrash}`;
            document.getElementById('timer').innerText = '00:00';
            document.getElementById('modal').classList.add('hidden');
            
            const modalContent = document.getElementById('modal-content');
            modalContent.classList.remove('scale-100', 'opacity-100');
            modalContent.classList.add('scale-95', 'opacity-0');

            // 重置 UFO 狀態
            const ufoEl = document.getElementById('ufo-container');
            ufoEl.style.display = 'block';
            ufoEl.style.transform = '';
            ufoEl.style.opacity = '';

            if (timerInterval) clearInterval(timerInterval);

            const beachWidth = beachArea.clientWidth;
            const beachHeight = beachArea.clientHeight;

            // 隨機在網頁下半部生成 50 個垃圾
            for (let i = 0; i < totalTrash; i++) {
                const trashData = trashTypes[Math.floor(Math.random() * trashTypes.length)];
                const trashEl = document.createElement('div');

                // 隨機旋轉角度 (-70度 到 70度)
                const rotAngle = Math.floor(Math.random() * 140) - 70;
                trashEl.style.setProperty('--rot', `${rotAngle}deg`);

                const randomX = Math.random() * Math.max(beachWidth - 80, 100);
                const randomY = Math.random() * Math.max(beachHeight - 80, 80);

                trashEl.className = `absolute cursor-pointer transition-transform duration-200 hover:scale-125 flex items-center justify-center drop-shadow-md select-none ${trashData.sizeClass}`;
                trashEl.style.left = `${randomX}px`;
                trashEl.style.top = `${randomY}px`;
                trashEl.style.transform = `rotate(${rotAngle}deg)`;

                trashEl.innerHTML = `<span title="${trashData.name} (+${trashData.points}分)">${trashData.emoji}</span>`;

                trashEl.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (trashEl.classList.contains('picked')) return;

                    if (!gameStarted) {
                        gameStarted = true;
                        startTimer();
                    }

                    trashEl.classList.add('picked');
                    playSound('collect');

                    score += trashData.points;
                    remainingCount--;
                    document.getElementById('score').innerText = score;
                    document.getElementById('remaining').innerText = `${remainingCount} / ${totalTrash}`;

                    showFloatingScore(e.clientX, e.clientY, trashData.points);

                    setTimeout(() => {
                        trashEl.remove();
                    }, 450);

                    if (remainingCount === 0) {
                        endGame();
                    }
                });

                beachArea.appendChild(trashEl);
            }
        }

        // 浮動得分特效
        function showFloatingScore(x, y, points) {
            const floatEl = document.createElement('div');
            floatEl.className = `fixed z-40 text-amber-600 font-black text-xl pointer-events-none transition-all duration-700 ease-out`;
            floatEl.style.left = `${x}px`;
            floatEl.style.top = `${y}px`;
            floatEl.innerText = `+${points}`;
            document.body.appendChild(floatEl);

            setTimeout(() => {
                floatEl.style.transform = `translateY(-60px) scale(1.3)`;
                floatEl.style.opacity = '0';
            }, 20);

            setTimeout(() => {
                floatEl.remove();
            }, 700);
        }

        // 計時器開始
        function startTimer() {
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                const secs = String(secondsElapsed % 60).padStart(2, '0');
                document.getElementById('timer').innerText = `${mins}:${secs}`;
            }, 1000);
        }

        // 遊戲結束與結算彈窗
        function endGame() {
            clearInterval(timerInterval);
            playSound('win');

            const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
            const secs = String(secondsElapsed % 60).padStart(2, '0');

            document.getElementById('final-score').innerText = score;
            document.getElementById('final-time').innerText = `${mins}:${secs}`;

            const modal = document.getElementById('modal');
            const modalContent = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modalContent.classList.remove('scale-95', 'opacity-0');
                modalContent.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function restartGame() {
            initGame();
        }

        window.onload = function() {
            initGame();
        };
    </script>
</body>
</html>
